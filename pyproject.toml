[project]
name = "hr-agentic"
version = "2.2.0"
description = "Enterprise HR Agentic Solution (MVP 1) grounded in Google Cloud Architecture Framework and OKF"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dateutil>=2.8.2",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:.*Using .httpx. with .starlette.testclient.*",
]
