[project]
name = "hr-agentic"
version = "2.2.0"
description = "Enterprise HR Agentic Solution (MVP 1) grounded in Google Cloud Architecture Framework, OKF, and MCP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dateutil>=2.8.2",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]
eval = [
    "pyyaml>=6.0",
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F841", "F401"]

[tool.ty]
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = [".venv/**", "tests/**"]

[tool.ty.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"
unsupported-operator = "ignore"

[tool.codespell]
skip = "./.venv/*,./.git/*,uv.lock,*.docx,*.txt,./data/*,*.md"
ignore-words-list = "rouge,requestor,sme,fpr,recuse,nd"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:.*Using .httpx. with .starlette.testclient.*",
]
